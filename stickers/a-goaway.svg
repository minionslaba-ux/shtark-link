<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    text, g, circle, path, rect { transform-box: fill-box; transform-origin: center; }
    .gloss { animation: gloss 3.2s ease-in-out infinite; }
    @keyframes gloss { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    .mad{animation:mad .5s ease-in-out infinite alternate}@keyframes mad{0%{transform:rotate(-5deg) scale(1)}100%{transform:rotate(5deg) scale(1.08)}}.pf{opacity:0;animation:puff 1.2s ease-out infinite}.p2{animation-delay:.1s}.p3{animation-delay:.3s}.p4{animation-delay:.4s}@keyframes puff{0%{opacity:0;transform:translateY(8px) scale(.4)}30%{opacity:.9}100%{opacity:0;transform:translateY(-22px) scale(1.4)}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="192" height="192" rx="40"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="22" y="22" width="212" height="212" rx="48" fill="#fff"/>
    <rect x="32" y="32" width="192" height="192" rx="40" fill="url(#g)"/>
  </g>
  <g clip-path="url(#c)">
    <rect class="gloss" x="0" y="20" width="90" height="220" fill="url(#gl)"/>
    <g fill="#fff" opacity=".85"><circle class="pf p1" cx="88" cy="70" r="9"/><circle class="pf p2" cx="168" cy="70" r="9"/><circle class="pf p3" cx="78" cy="56" r="6"/><circle class="pf p4" cx="178" cy="56" r="6"/></g><text class="mad" x="128" y="128" font-size="78" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">😤</text>
  </g>
  <text x="128" y="176" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="-.5" textLength="172" lengthAdjust="spacingAndGlyphs">Отъебитесь</text>
  <g>
    <rect x="82" y="191" width="92" height="22" rx="11" fill="#fff" fill-opacity=".92"/>
    <text x="134" y="206" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7f1d1d" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="2.2">SHTARK</text>
    <circle cx="96" cy="202" r="4" fill="#7f1d1d"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    text, g, circle, path, rect { transform-box: fill-box; transform-origin: center; }
    .gloss { animation: gloss 3.2s ease-in-out infinite; }
    @keyframes gloss { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    .sun{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.cool{animation:dance 1s ease-in-out infinite}@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-6px)}}.cf{animation:fall 2.4s linear infinite;opacity:0}.c0{animation-delay:0.00s}.c1{animation-delay:0.27s}.c2{animation-delay:0.54s}.c3{animation-delay:0.81s}.c4{animation-delay:1.08s}.c5{animation-delay:1.35s}.c6{animation-delay:1.62s}.c7{animation-delay:1.89s}.c8{animation-delay:2.16s}@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(160px) rotate(480deg);opacity:0}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="192" height="192" rx="40"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="22" y="22" width="212" height="212" rx="48" fill="#fff"/>
    <rect x="32" y="32" width="192" height="192" rx="40" fill="url(#g)"/>
  </g>
  <g clip-path="url(#c)">
    <rect class="gloss" x="0" y="20" width="90" height="220" fill="url(#gl)"/>
    <text class="sun" x="196" y="76" font-size="34" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">☀️</text><rect class="cf c0" x="44" y="20" width="6" height="10" rx="2" fill="#fde047"/><rect class="cf c1" x="64" y="20" width="6" height="10" rx="2" fill="#fff"/><rect class="cf c2" x="84" y="20" width="6" height="10" rx="2" fill="#67e8f9"/><rect class="cf c3" x="104" y="20" width="6" height="10" rx="2" fill="#a3e635"/><rect class="cf c4" x="124" y="20" width="6" height="10" rx="2" fill="#fff"/><rect class="cf c5" x="144" y="20" width="6" height="10" rx="2" fill="#fdba74"/><rect class="cf c6" x="164" y="20" width="6" height="10" rx="2" fill="#fff"/><rect class="cf c7" x="184" y="20" width="6" height="10" rx="2" fill="#c4b5fd"/><rect class="cf c8" x="204" y="20" width="6" height="10" rx="2" fill="#fde047"/><text class="cool" x="118" y="132" font-size="76" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">🥳</text>
  </g>
  <text x="128" y="176" font-size="24" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="-.5" textLength="176" lengthAdjust="spacingAndGlyphs">Хороших выходных!</text>
  <g>
    <rect x="82" y="191" width="92" height="22" rx="11" fill="#fff" fill-opacity=".92"/>
    <text x="134" y="206" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7c3aed" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="2.2">SHTARK</text>
    <circle cx="96" cy="202" r="4" fill="#7c3aed"/>
  </g>
</svg>

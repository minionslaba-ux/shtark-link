<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    text, g, circle, path, rect { transform-box: fill-box; transform-origin: center; }
    .gloss { animation: gloss 3.2s ease-in-out infinite; }
    @keyframes gloss { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    .cake{animation:cake 1.4s ease-in-out infinite}@keyframes cake{0%,100%{transform:scale(1)}50%{transform:scale(1.08) rotate(-3deg)}}.bl{animation:float 2.4s ease-in-out infinite}.b2{animation-delay:.8s}@keyframes float{0%,100%{transform:translateY(4px) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}.fl{animation:flame .3s ease-in-out infinite alternate}@keyframes flame{0%{transform:scale(.8,1);opacity:.8}100%{transform:scale(1.1,1.2);opacity:1}}.cf{animation:fall 2.4s linear infinite;opacity:0}.c0{animation-delay:0.00s}.c1{animation-delay:0.27s}.c2{animation-delay:0.54s}.c3{animation-delay:0.81s}.c4{animation-delay:1.08s}.c5{animation-delay:1.35s}.c6{animation-delay:1.62s}.c7{animation-delay:1.89s}.c8{animation-delay:2.16s}@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(160px) rotate(480deg);opacity:0}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="192" height="192" rx="40"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="22" y="22" width="212" height="212" rx="48" fill="#fff"/>
    <rect x="32" y="32" width="192" height="192" rx="40" fill="url(#g)"/>
  </g>
  <g clip-path="url(#c)">
    <rect class="gloss" x="0" y="20" width="90" height="220" fill="url(#gl)"/>
    <text class="bl b1" x="62" y="92" font-size="30" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">🎈</text><text class="bl b2" x="196" y="84" font-size="28" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">🎈</text><rect class="cf c0" x="48" y="18" width="6" height="10" rx="2" fill="#fde047"/><rect class="cf c1" x="68" y="18" width="6" height="10" rx="2" fill="#fff"/><rect class="cf c2" x="88" y="18" width="6" height="10" rx="2" fill="#67e8f9"/><rect class="cf c3" x="108" y="18" width="6" height="10" rx="2" fill="#a3e635"/><rect class="cf c4" x="128" y="18" width="6" height="10" rx="2" fill="#fff"/><rect class="cf c5" x="148" y="18" width="6" height="10" rx="2" fill="#fdba74"/><rect class="cf c6" x="168" y="18" width="6" height="10" rx="2" fill="#fff"/><rect class="cf c7" x="188" y="18" width="6" height="10" rx="2" fill="#c4b5fd"/><rect class="cf c8" x="208" y="18" width="6" height="10" rx="2" fill="#fde047"/><text class="cake" x="128" y="130" font-size="74" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">🎂</text>
  </g>
  <text x="128" y="176" font-size="24" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="-.5" textLength="176" lengthAdjust="spacingAndGlyphs">С днём рождения!</text>
  <g>
    <rect x="82" y="191" width="92" height="22" rx="11" fill="#fff" fill-opacity=".92"/>
    <text x="134" y="206" font-size="12.5" font-weight="800" text-anchor="middle" fill="#c026d3" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="2.2">SHTARK</text>
    <circle cx="96" cy="202" r="4" fill="#c026d3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    text, g, circle, path, rect { transform-box: fill-box; transform-origin: center; }
    .gloss { animation: gloss 3.2s ease-in-out infinite; }
    @keyframes gloss { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    .cf{animation:fall 2.2s linear infinite}.c0{animation-delay:0.00s}.c1{animation-delay:0.23s}.c2{animation-delay:0.46s}.c3{animation-delay:0.69s}.c4{animation-delay:0.92s}.c5{animation-delay:1.15s}.c6{animation-delay:1.38s}.c7{animation-delay:1.61s}.c8{animation-delay:1.84s}.c9{animation-delay:2.07s}@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(170px) rotate(540deg);opacity:0}}.party{animation:tilt 1.1s ease-in-out infinite}@keyframes tilt{50%{transform:rotate(-10deg) scale(1.08)}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="192" height="192" rx="40"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="22" y="22" width="212" height="212" rx="48" fill="#fff"/>
    <rect x="32" y="32" width="192" height="192" rx="40" fill="url(#g)"/>
  </g>
  <g clip-path="url(#c)">
    <rect class="gloss" x="0" y="20" width="90" height="220" fill="url(#gl)"/>
    <rect class="cf c0" x="40" y="20" width="7" height="11" rx="2" fill="#fff"/><rect class="cf c1" x="58" y="20" width="7" height="11" rx="2" fill="#22d3ee"/><rect class="cf c2" x="76" y="20" width="7" height="11" rx="2" fill="#a3e635"/><rect class="cf c3" x="94" y="20" width="7" height="11" rx="2" fill="#f472b6"/><rect class="cf c4" x="112" y="20" width="7" height="11" rx="2" fill="#fde047"/><rect class="cf c5" x="130" y="20" width="7" height="11" rx="2" fill="#fff"/><rect class="cf c6" x="148" y="20" width="7" height="11" rx="2" fill="#c084fc"/><rect class="cf c7" x="166" y="20" width="7" height="11" rx="2" fill="#34d399"/><rect class="cf c8" x="184" y="20" width="7" height="11" rx="2" fill="#fb7185"/><rect class="cf c9" x="202" y="20" width="7" height="11" rx="2" fill="#fff"/><text class="party" x="128" y="128" font-size="78" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">🎉</text>
  </g>
  <text x="128" y="176" font-size="34" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="-.5">Ура!</text>
  <g>
    <rect x="82" y="191" width="92" height="22" rx="11" fill="#fff" fill-opacity=".92"/>
    <text x="134" y="206" font-size="12.5" font-weight="800" text-anchor="middle" fill="#ea580c" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="2.2">SHTARK</text>
    <circle cx="96" cy="202" r="4" fill="#ea580c"/>
  </g>
</svg>

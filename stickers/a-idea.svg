<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    text, g, circle, path, rect { transform-box: fill-box; transform-origin: center; }
    .gloss { animation: gloss 3.2s ease-in-out infinite; }
    @keyframes gloss { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    .bulb{animation:glow 1.4s ease-in-out infinite}.rays{animation:rays 1.4s ease-in-out infinite}@keyframes glow{50%{transform:scale(1.12)}}@keyframes rays{0%,100%{opacity:.2;transform:scale(.9)}50%{opacity:1;transform:scale(1.05)}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="192" height="192" rx="40"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="22" y="22" width="212" height="212" rx="48" fill="#fff"/>
    <rect x="32" y="32" width="192" height="192" rx="40" fill="url(#g)"/>
  </g>
  <g clip-path="url(#c)">
    <rect class="gloss" x="0" y="20" width="90" height="220" fill="url(#gl)"/>
    <g class="rays" stroke="#fff" stroke-width="6" stroke-linecap="round"><path d="M128 32 v14"/><path d="M78 52 l10 10"/><path d="M178 52 l-10 10"/><path d="M62 100 h14"/><path d="M194 100 h-14"/></g><text class="bulb" x="128" y="134" font-size="76" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">💡</text>
  </g>
  <text x="128" y="176" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="-.5" textLength="172" lengthAdjust="spacingAndGlyphs">Есть идея!</text>
  <g>
    <rect x="82" y="191" width="92" height="22" rx="11" fill="#fff" fill-opacity=".92"/>
    <text x="134" y="206" font-size="12.5" font-weight="800" text-anchor="middle" fill="#b45309" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="2.2">SHTARK</text>
    <circle cx="96" cy="202" r="4" fill="#b45309"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    text, g, circle, path, rect { transform-box: fill-box; transform-origin: center; }
    .gloss { animation: gloss 3.2s ease-in-out infinite; }
    @keyframes gloss { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    .bounce{animation:bounce 1.1s cubic-bezier(.3,1.6,.6,1) infinite}@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.12) rotate(-8deg)}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="192" height="192" rx="40"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="22" y="22" width="212" height="212" rx="48" fill="#fff"/>
    <rect x="32" y="32" width="192" height="192" rx="40" fill="url(#g)"/>
  </g>
  <g clip-path="url(#c)">
    <rect class="gloss" x="0" y="20" width="90" height="220" fill="url(#gl)"/>
    <text class="bounce" x="128" y="128" font-size="78" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">👍</text>
  </g>
  <text x="128" y="176" font-size="34" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="-.5">Принято</text>
  <g>
    <rect x="82" y="191" width="92" height="22" rx="11" fill="#fff" fill-opacity=".92"/>
    <text x="134" y="206" font-size="12.5" font-weight="800" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" letter-spacing="2.2">SHTARK</text>
    <circle cx="96" cy="202" r="4" fill="#1d4ed8"/>
  </g>
</svg>
